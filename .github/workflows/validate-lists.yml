name: Validate tofa JSON Lists

on:
  push:
    paths:
      - '*.json'
  pull_request:
    paths:
      - '*.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate JSON files and tofa_list schema
        run: |
          python3 - << 'EOF'
          import glob, json, sys

          files = glob.glob("*.json")
          if not files:
              print("No JSON files found in repository root")
              sys.exit(0)

          errors = []
          for path in files:
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      data = json.load(f)
              except Exception as e:
                  errors.append(f"{path}: Invalid JSON syntax ({e})")
                  continue

              if data.get("tofa_list") != 1:
                  errors.append(f"{path}: Missing or invalid 'tofa_list' (must be 1)")
              if not isinstance(data.get("name"), str) or not data["name"].strip():
                  errors.append(f"{path}: Missing or empty 'name'")
              items = data.get("items")
              if not isinstance(items, list) or len(items) == 0:
                  errors.append(f"{path}: 'items' must be a non-empty list")
                  continue

              orders = []
              for idx, item in enumerate(items, start=1):
                  if not any(k in item for k in ("imdb_id", "tmdb_id", "tvdb_id")):
                      errors.append(f"{path} (item {idx}): Missing imdb_id, tmdb_id, or tvdb_id")
                  if "type" in item and item["type"] not in ("movie", "show"):
                      errors.append(f"{path} (item {idx}): Invalid type '{item['type']}' (must be 'movie' or 'show')")
                  if "order" in item:
                      if item["order"] in orders:
                          errors.append(f"{path} (item {idx}): Duplicate order number {item['order']}")
                      orders.append(item["order"])

          if errors:
              print("❌ Validation failed:")
              for err in errors:
                  print("  -", err)
              sys.exit(1)
          else:
              print(f"✅ All {len(files)} list(s) are valid!")
          EOF
